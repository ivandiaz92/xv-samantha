<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <defs>
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="softBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <radialGradient id="blush1" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#F0C4CB" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#F0C4CB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0C4CB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose1" cx="78%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#C87D87" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#C87D87" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C87D87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bisque1" cx="82%" cy="78%" r="52%">
      <stop offset="0%" stop-color="#E5BCA9" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#E5BCA9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E5BCA9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="thyme1" cx="18%" cy="80%" r="42%">
      <stop offset="0%" stop-color="#6B7556" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6B7556" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6B7556" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush2" cx="52%" cy="8%" r="40%">
      <stop offset="0%" stop-color="#F0C4CB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0C4CB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose2" cx="40%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#C87D87" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C87D87" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Champagne paper base -->
  <rect width="1600" height="1000" fill="#FBEAD6"/>

  <g filter="url(#watercolor)">
    <ellipse cx="220" cy="180" rx="480" ry="360" fill="url(#blush1)" filter="url(#softBloom)"/>
    <ellipse cx="1280" cy="160" rx="420" ry="320" fill="url(#rose1)" filter="url(#softBloom)"/>
    <ellipse cx="1350" cy="820" rx="460" ry="340" fill="url(#bisque1)" filter="url(#softBloom)"/>
    <ellipse cx="240" cy="820" rx="380" ry="300" fill="url(#thyme1)" filter="url(#softBloom)"/>
    <ellipse cx="820" cy="60" rx="360" ry="220" fill="url(#blush2)" filter="url(#softBloom)"/>
    <ellipse cx="700" cy="620" rx="300" ry="240" fill="url(#rose2)" filter="url(#softBloom)"/>
    <!-- Extra soft blooms -->
    <ellipse cx="1000" cy="480" rx="260" ry="200" fill="#F0C4CB" fill-opacity="0.22" filter="url(#softBloom)"/>
    <ellipse cx="480" cy="400" rx="220" ry="180" fill="#E5BCA9" fill-opacity="0.25" filter="url(#softBloom)"/>
  </g>
</svg>
